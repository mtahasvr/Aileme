
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ailem İçin Bir Orkide 💜</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#030208;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
}

.scene {
  width:100%;
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  perspective:1000px;
}

.ambient {
  position:absolute;
  width:320px;
  height:320px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(178,70,255,.22),
    rgba(120,30,180,.08) 45%,
    transparent 72%);
  opacity:0;
  animation:light 4s 1s forwards;
}

@keyframes light {
  to { opacity:1; transform:scale(1.5); }
}

.orchid {
  position:relative;
  width:300px;
  height:430px;
  transform-style:preserve-3d;
  opacity:0;
  animation:appear 3s 1s forwards;
}

@keyframes appear {
  from { opacity:0; transform:translateY(50px) scale(.6); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.stem {
  position:absolute;
  width:7px;
  height:320px;
  background:linear-gradient(90deg,#173b24,#5a9c54,#173b24);
  left:148px;
  top:80px;
  border-radius:100%;
  transform:scaleY(0);
  transform-origin:bottom;
  animation:grow 4s 2s ease forwards;
}

@keyframes grow {
  to { transform:scaleY(1); }
}

.leaf {
  position:absolute;
  width:115px;
  height:48px;
  border-radius:100% 0 100% 0;
  background:linear-gradient(135deg,#76a75c,#183e29 75%);
  top:345px;
  left:60px;
  opacity:0;
  box-shadow:inset 4px 3px 10px #a1c77a55;
  animation:leaf 2s 4s forwards;
}

.leaf.two {
  left:135px;
  top:355px;
  transform:rotate(70deg);
  animation-delay:4.5s;
}

@keyframes leaf {
  to { opacity:1; }
}

.branch {
  position:absolute;
  width:5px;
  height:180px;
  background:linear-gradient(90deg,#244c2c,#83ad60,#244c2c);
  left:150px;
  top:65px;
  border-radius:100%;
  transform:rotate(-17deg) scaleY(0);
  transform-origin:bottom;
  animation:branch 3s 3s forwards;
}

@keyframes branch {
  to { transform:rotate(-17deg) scaleY(1); }
}

.flower {
  position:absolute;
  width:130px;
  height:120px;
  transform:scale(0);
  opacity:0;
  animation:open 3s cubic-bezier(.2,.8,.2,1) forwards;
  filter:drop-shadow(0 0 12px #bd65ff44);
}

.f1 { top:65px; left:85px; animation-delay:4.2s; }
.f2 { top:160px; left:5px; transform:rotate(-25deg) scale(0); animation-delay:5.5s; }
.f3 { top:170px; left:155px; transform:rotate(20deg) scale(0); animation-delay:6.2s; }

@keyframes open {
  0% { opacity:0; transform:scale(0) rotate(-25deg); }
  70% { opacity:1; transform:scale(1.15) rotate(5deg); }
  100% { opacity:1; transform:scale(1) rotate(0); }
}

.petal {
  position:absolute;
  width:66px;
  height:78px;
  border-radius:75% 75% 45% 45%;
  background:linear-gradient(135deg,
    #fff0ff 0%,
    #e6a6f8 22%,
    #bd61e5 55%,
    #64228e 100%);
  box-shadow:
    inset 5px 5px 12px #ffffff77,
    inset -7px -8px 14px #49116b88,
    0 0 12px #df8cff33;
}

.p1 { left:32px; top:0; transform:rotate(-38deg); }
.p2 { left:32px; top:0; transform:rotate(38deg); }
.p3 { left:0; top:23px; transform:rotate(-72deg); }
.p4 { left:64px; top:23px; transform:rotate(72deg); }
.p5 {
  left:23px; top:33px;
  width:85px; height:66px;
  background:linear-gradient(145deg,#fff2ff,#e8a2f7 50%,#8b36b3);
  border-radius:55% 55% 70% 70%;
}

.lip {
  position:absolute;
  width:43px;
  height:33px;
  background:linear-gradient(135deg,#fff0ff,#d77ae8,#8b268f);
  border-radius:45% 45% 60% 60%;
  left:44px;
  top:65px;
  box-shadow:inset 0 3px 6px #fff8;
}

.center {
  position:absolute;
  width:13px;
  height:13px;
  background:#ffdf9c;
  border-radius:50%;
  left:59px;
  top:67px;
  box-shadow:0 0 12px #ffdd8b;
}

.message {
  color:#f3d7ff;
  text-align:center;
  font-size:21px;
  letter-spacing:2px;
  padding:20px;
  opacity:0;
  animation:message 3s 9s forwards;
  text-shadow:0 0 20px #c76aff;
}

.sub {
  color:#c9a5d8;
  font-size:12px;
  letter-spacing:4px;
  margin-top:10px;
  opacity:0;
  animation:message 3s 10s forwards;
}

@keyframes message { to { opacity:1; } }

.spark {
  position:absolute;
  color:#f4caff;
  font-size:16px;
  animation:twinkle 3s infinite ease-in-out;
  opacity:0;
}

@keyframes twinkle {
  0%,100% { opacity:0; transform:scale(.4) rotate(0); }
  50% { opacity:1; transform:scale(1.5) rotate(90deg); }
}

@media(max-width:400px) {
  .orchid { transform:scale(.85); }
  .message { font-size:17px; }
}
</style>
</head>

<body>
<div class="scene">

<div class="ambient"></div>

<div class="orchid">
  <div class="stem"></div>
  <div class="branch"></div>
  <div class="leaf"></div>
  <div class="leaf two"></div>

  <div class="flower f1">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="lip"></div>
    <div class="center"></div>
  </div>

  <div class="flower f2">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="lip"></div>
    <div class="center"></div>
  </div>

  <div class="flower f3">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="lip"></div>
    <div class="center"></div>
  </div>
</div>

<div class="message">
  İyi ki varsınız, canım ailem 💜
</div>
<div class="sub">
  Sebih,Senehet,Mümine,Yusuf,Beyzanur
</div>

<div class="spark" style="top:20%;left:20%;animation-delay:1s">✧</div>
<div class="spark" style="top:35%;right:20%;animation-delay:2s">✦</div>
<div class="spark" style="bottom:20%;left:25%;animation-delay:3s">✧</div>
<div class="spark" style="bottom:25%;right:25%;animation-delay:1.5s">✦</div>
<div class="spark" style="top:15%;right:35%;animation-delay:2.5s">✧</div>

</div>
</body>
</html>
